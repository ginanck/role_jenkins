---

# Agent workspace configuration
jenkins_agent_workdir: "{{ jenkins_dir }}/agent"
jenkins_agent_executors: 2
jenkins_agent_labels: "linux docker"
jenkins_agent_description: "Linux build agent"

# Remoting configuration
jenkins_agent_mode: "normal"  # Options: normal, exclusive
jenkins_agent_env_vars:
  JAVA_HOME: "/opt/java/amazon-corretto-21.0.7.6.1-linux-x64"
  PATH: "/usr/local/bin:/usr/bin:/bin:$JAVA_HOME/bin"

# Java options for the agent
jenkins_agent_java_opts: "-Xmx1024m -Xms256m"

# Connection settings
jenkins_agent_connection_retries: 60
jenkins_agent_connection_retry_interval: 10
jenkins_agent_protocol: "JNLP4-connect"  # Options: JNLP4-connect, JNLP-connect, etc.
