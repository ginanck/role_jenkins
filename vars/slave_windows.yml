---

# Existing variables
jenkins_win_dir: "C:\\jenkins"
jenkins_win_nssm_path: "C:\\NSSM"
jenkins_win_nssm_file_name: "nssm-2.24.zip"
jenkins_win_nssm_svc_url: "https://nssm.cc/release/nssm-2.24.zip"
jenkins_win_agent_service_name: "JenkinsAgent"
jenkins_win_agent_service_display_name: "Jenkins Agent"

# New configuration variables
jenkins_agent_workdir: "{{ jenkins_win_dir }}\\workspace"
jenkins_agent_executors: 2
jenkins_agent_labels: "windows dotnet msbuild"
jenkins_agent_description: "Windows build agent"
jenkins_agent_mode: "normal"  # Options: normal, exclusive

# Remoting configuration
jenkins_agent_env_vars:
  JAVA_HOME: "C:\\Program Files\\Amazon Corretto\\jdk11.0.19_7"
  PATH: "%PATH%;%JAVA_HOME%\\bin;C:\\Program Files\\Git\\bin"

# Java options for the agent
jenkins_agent_java_opts: "-Xmx512m -Xms256m"

# Connection settings
jenkins_agent_connection_retries: 60
jenkins_agent_connection_retry_interval: 10
jenkins_agent_protocol: "JNLP4-connect"
