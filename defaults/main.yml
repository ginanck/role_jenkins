---
# defaults file for role_jenkins

jenkins_http_url: http://jenkins-ci.internal.guru:8080

jenkins_timezone: Europe/Istanbul
jenkins_version: 2.462.3

# https://www.jenkins.io/changelog-stable/
jenkins_war_file_url: https://get.jenkins.io/war-stable/{{ jenkins_version }}/jenkins.war

jenkins_alternative_priority: "{{ ansible_date_time.epoch | int }}"

jenkins_user: jenkins
jenkins_group: jenkins

jenkins_servlet_systemd_service: tomcat
jenkins_servlet_user: tomcat
jenkins_servlet_group: tomcat

jenkins_dir: /opt/jenkins
jenkins_versioned_dir: "{{ jenkins_dir }}/versioned/{{ jenkins_version }}_{{ jenkins_alternative_priority }}"
jenkins_versioned_home: "{{ jenkins_versioned_dir }}/home"
jenkins_versioned_war: "{{ jenkins_versioned_dir }}/{{ jenkins_user }}.war"
jenkins_versioned_cli: "{{ jenkins_versioned_dir }}/{{ jenkins_user }}-cli.jar"

jenkins_builds_dir: "{{ jenkins_dir }}/builds"
jenkins_workspaces_dir: "{{ jenkins_dir }}/workspace"

jenkins_link_home: "{{ jenkins_dir }}/home"
jenkins_link_war: "{{ jenkins_dir }}/{{ jenkins_user }}.war"
jenkins_link_cli: "{{ jenkins_dir }}/{{ jenkins_user }}-cli.jar"

jenkins_svc_admin_account:
  full_name: "Jenkins Admin Account"
  username: "jenkins-admin"
  password: "Passw0rd1"
  email: "jenkins-admin@nnc.guru"
  token_name: "jenkins-api-token"

jenkins_prerequisite_packages:
  - fontconfig
  - curl
  - wget
  - unzip

jenkins_default_plugins:
  - job-dsl
  - ws-cleanup
  - timestamper
  - build-timeout
  - antisamy-markup-formatter
  - mailer
  - email-ext
  - credentials-binding
  - plain-credentials
  - ssh-credentials
  - pam-auth
  - git
  - git-client
  - dashboard-view
  - pipeline-stage-view
  - workflow-job
  - workflow-cps
  - workflow-api
  - pipeline-model-api
  - pipeline-model-definition
  - pipeline-graph-view
  - pipeline-groovy-lib
  - pipeline-config-history
  - jobConfigHistory
  - ansicolor
  - people-view

