---

- name: get epoch time for priority
  set_fact:
    adjusted_timestamp: "{{ lookup('pipe', 'date +%s') | int % 2147483647 }}"

- name: update alternatives for the default Jenkins version WAR file
  community.general.alternatives:
    name: "{{ jenkins_service }}.war"
    link: /etc/alternatives
    path: "{{ jenkins_versioned_dir }}/{{ jenkins_service }}.war"
    priority: "{{ adjusted_timestamp }}"
    state: selected

- name: fetch current Jenkins alternatives
  ansible.builtin.command: update-alternatives --display {{ jenkins_service }}.war
  changed_when: false
  register: jenkins_alternatives_output

- name: parse Jenkins alternatives output
  ansible.builtin.set_fact:
    jenkins_alternatives: "{{ jenkins_alternatives_output.stdout_lines|select('match', '^.+ - priority .+$')|map('regex_replace', '^(.+) - priority (.+)$', '\\2 \\1')|sort }}"

- name: ensure only the last 4 alternatives are kept
  community.general.alternatives:
    name: "{{ jenkins_service }}.war"
    path: "{{ item.split()[1] }}"
    state: absent
  loop: "{{ jenkins_alternatives[:-4] }}"
  when: "{{ jenkins_alternatives|length > 4 }}"
