---
# tasks file for role_jenkins_master

- name: setup jenkins user on all hosts
  ansible.builtin.import_tasks: setup-user.yml

- name: setup jenkins master
  ansible.builtin.import_tasks: install-master.yml
  when:
    - jenkins_setup_type is defined
    - jenkins_setup_type == "install"

- name: get agent secrets from master
  ansible.builtin.include_tasks: agent-secrets.yml
