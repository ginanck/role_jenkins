---
# tasks file for role_jenkins

- name: setup jenkins user on all hosts
  ansible.builtin.import_tasks: jenkins-setup-user.yml

- name: setup jenkins master
  ansible.builtin.import_tasks: jenkins-install-master.yml
  when:
    - jenkins_setup_type is defined
    - jenkins_setup_type == "install"
    - jenkins_config_node_type == "master"

- name: copy groovy scripts to master for retreive agent secrets
  ansible.builtin.include_tasks: jenkins-copy-scripts.yml
  when:
    - jenkins_config_node_type == "master"

- name: setup jenkins jnlp agent
  ansible.builtin.import_tasks: jenkins-install-slave.yml
  when:
    - jenkins_setup_type is defined
    - jenkins_setup_type == "install"
    - jenkins_config_node_type == "slave"
