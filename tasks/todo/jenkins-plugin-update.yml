---

- name: get list of installed plugins
  ansible.builtin.uri:
    url: http://localhost:8080/pluginManager/api/json?depth=1
    remote_src: true
    force_basic_auth: true
    url_username: "{{ jenkins_admin_username }}"
    url_password: "{{ jenkins_admin_password }}"
    headers:
      Content-Type: application/json
  register: installed_plugins

- name: create dictionary of installed plugins
  set_fact:
    installed_plugins_dict: "{{ installed_plugins_dict | default({}) | combine({item.shortName: item}) }}"
  loop: "{{ installed_plugins.json.plugins }}"

- name: create list of upgradable plugins
  set_fact:
    upgradable_plugins: "{{ upgradable_plugins | default([]) + [item.key] }}"
  when: item.value.hasUpdate
  loop: "{{ installed_plugins_dict.items() }}"

- name: upgrade plugins if available
  ansible.builtin.shell: java -jar jenkins-cli.jar -s http://localhost:8080 -auth {{ jenkins_admin_username }}:{{ jenkins_admin_password }} install-plugin {{ item }}
  args:
    chdir: "{{ jenkins_versioned_dir }}"
    executable: /bin/bash
  loop: "{{ upgradable_plugins }}"
