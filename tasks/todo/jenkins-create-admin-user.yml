---

- name: create admin user groovy
  ansible.builtin.template:
    src: create_admin.groovy.j2
    dest: "{{ jenkins_versioned_dir }}/create_admin.groovy"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"

- name: create admin user
  ansible.builtin.shell: java -jar jenkins-cli.jar -s http://localhost:8080 -auth groovy = < create_admin.groovy
  args:
    chdir: "{{ jenkins_versioned_dir }}"
    executable: /bin/bash
