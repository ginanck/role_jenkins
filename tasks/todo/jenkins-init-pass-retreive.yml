---

- name: check if initialAdminPassword file exists
  ansible.builtin.stat:
    path: "{{ jenkins_versioned_home }}/secrets/initialAdminPassword"
  retries: 20
  delay: 5
  register: result
  until: result.rc == 0

- name: get Jenkins initial admin password from remote host if the file exists
  ansible.builtin.slurp:
    src: "{{ jenkins_versioned_home }}/secrets/initialAdminPassword"
  register: slurp_result
  when: result.stat.exists

- name: set Jenkins initial admin password from initialAdminPassword
  ansible.builtin.set_fact:
    username: "admin"
    password: "{{ slurp_result['content'] | b64decode | replace('\n', '') }}"
  when: result.stat.exists and slurp_result is defined

- name: if initialAdminPassword does not exist, retreive svc-jenkins creds from Vault
  delegate_to: localhost
  vars:
    secret: "{{ lookup('hashi_vault', 'secret={{ vault_secret_path }} auth_method={{ vault_auth_method }} url={{ vault_url }}')}}"
  when: not result.stat.exists

- name: set Jenkins password for svc-jenkins user
  ansible.builtin.set_fact:
    username: "{{ secret.username }}"
    password: "{{ secret.password }}"
  when: not result.stat.exists
