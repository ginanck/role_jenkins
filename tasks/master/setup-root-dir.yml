---

- name: create jenkins root and groovy directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ jenkins_servlet_user }}"
    group: "{{ jenkins_servlet_group }}"
    state: directory
    recurse: true
    mode: '0775'
  with_items:
    - "{{ jenkins_dir }}"
    - "{{ jenkins_dir }}/groovy"
    - "{{ jenkins_builds_dir }}"
    - "{{ jenkins_workspaces_dir }}"
  loop_control:
    label: "{{ item }}"
