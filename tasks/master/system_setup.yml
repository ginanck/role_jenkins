---
# Functional: System prerequisites and directory structure
# Used by: install.yml, upgrade.yml
# Consolidates: prerequisite.yml, setup-root-dir.yml, setup-versioned-dirs.yml

- name: Install prerequisite packages
  ansible.builtin.package:
    name: "{{ jenkins_prerequisite_packages }}"
    state: present
  when: operation is not defined or operation != 'versioned_dirs_only'

- name: Create Jenkins root and groovy directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ jenkins_servlet_user }}"
    group: "{{ jenkins_servlet_group }}"
    state: directory
    recurse: true
    mode: '0775'
  loop:
    - "{{ jenkins_dir }}"
    - "{{ jenkins_dir }}/groovy"
    - "{{ jenkins_builds_dir }}"
    - "{{ jenkins_workspaces_dir }}"
  loop_control:
    label: "{{ item }}"
  when: operation is not defined or operation != 'versioned_dirs_only'

- name: Create Jenkins versioned directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ jenkins_servlet_user }}"
    group: "{{ jenkins_servlet_group }}"
    state: directory
    recurse: true
    mode: '0775'
  loop:
    - "{{ jenkins_versioned_dir }}"
    - "{{ jenkins_versioned_home }}"
  loop_control:
    label: "{{ item }}"
