---

- name: gathering service facts
  ansible.builtin.service_facts:

- name: Fail if service is not exist
  ansible.builtin.fail:
    msg: The system required java and tomcat service to be installed.
  when: ansible_facts.services['tomcat.service'] is not defined

- name: check jenkins already initialized
  ansible.builtin.stat:
    path: "{{ jenkins_dir }}/initialized"
  register: node_initialized_check

- name: set fact about node initialized status
  ansible.builtin.set_fact:
    node_already_initialized: "{{ node_initialized_check.stat.exists }}"

- name: display node status
  ansible.builtin.debug:
    msg: "Jenkins already initialized: {{ node_already_initialized | bool | upper }}"


- name: check jenkins install/upgrade requirements
  when: node_already_initialized
  vars:
    jenkins_cli_auth_required: true
  block:
    - name: check current version
      ansible.builtin.include_tasks: master/version-check.yml

    - name: set current jenkins version fact
      ansible.builtin.set_fact:
        current_jenkins_version: "{{ current_version_check_result.stdout | trim }}"
      when: current_version_check_result.rc == 0

    - name: set current jenkins version to unknown if file doesn't exist
      ansible.builtin.set_fact:
        current_jenkins_version: "unknown"
      when: current_version_check_result.rc != 0

    - name: display current and target versions
      ansible.builtin.debug:
        msg: |
          Current cluster version: {{ current_jenkins_version }}
          Target cluster version: {{ jenkins_version }}

    - name: determine if upgrade is needed
      ansible.builtin.set_fact:
        upgrade_needed: "{{ current_jenkins_version != 'unknown' and 
                           current_jenkins_version is version(jenkins_version, '<') }}"

    - name: display upgrade decision
      ansible.builtin.debug:
        msg: "Upgrade needed: {{ upgrade_needed | bool | upper }}"


- name: Install and Start Jenkins
  when: not node_already_initialized
  vars:
    jenkins_cli_auth_required: false
  block:
    - name: INSTALL - install prerequisite packages
      ansible.builtin.include_tasks: common/prerequisite.yml

    - name: INSTALL - setup directories
      ansible.builtin.include_tasks: master/setup-dirs.yml

    - name: INSTALL - setup update-alternatives
      ansible.builtin.include_tasks: master/setup-alternatives.yml

    - name: INSTALL - setup groovy scripts
      ansible.builtin.include_tasks: master/setup-groovy-scripts.yml

    - name: INSTALL - download and extract jenkins war
      ansible.builtin.include_tasks: master/setup-jenkins-war.yml

    - name: INSTALL - restart jenkins servlet
      ansible.builtin.include_tasks: master/restart-servlet.yml

    - name: INSTALL - setup jenkins-cli.jar
      ansible.builtin.include_tasks: master/setup-cli.yml

    - name: INSTALL - update plugin repository
      ansible.builtin.include_tasks: master/plugin-update-center.yml

    - name: INSTALL - install plugins
      ansible.builtin.include_tasks: master/plugin-install.yml

    - name: INSTALL - safe-restart after plugins installed
      ansible.builtin.include_tasks: master/safe-restart.yml

    - name: INSTALL - version marker
      ansible.builtin.include_tasks: master/marker-initialized.yml


- name: Upgrade Jenkins master
  when: node_already_initialized and upgrade_needed
  vars:
    jenkins_cli_auth_required: true
  block:
    - name: UPGRADE - check login page before safe-update plugins
      ansible.builtin.include_tasks: common/login.yml

    - name: UPGRADE - install prerequisite packages
      ansible.builtin.include_tasks: master/plugin-update-center.yml

    - name: UPGRADE - safe-plugin update
      ansible.builtin.include_tasks: master/plugin-safe-update.yml

    - name: UPGRADE - stop jenkins servlet
      ansible.builtin.include_tasks: master/stop-servlet.yml

    - name: UPGRADE - setup directories
      ansible.builtin.include_tasks: master/setup-dirs.yml

    - name: UPGRADE - copy jenkins home content
      ansible.builtin.include_tasks: master/copy-home-content.yml

    - name: UPGRADE - cleanup old home folders
      ansible.builtin.include_tasks: master/cleanup-old-home.yml

    - name: UPGRADE - setup update-alternatives
      ansible.builtin.include_tasks: master/setup-alternatives.yml

    - name: UPGRADE - download and extract jenkins war
      ansible.builtin.include_tasks: master/setup-jenkins-war.yml

    - name: UPGRADE - restart jenkins servlet
      ansible.builtin.include_tasks: master/restart-servlet.yml

    - name: UPGRADE - setup jenkins-cli.jar
      ansible.builtin.include_tasks: master/setup-cli.yml

    - name: UPGRADE - full-plugin update
      ansible.builtin.include_tasks: master/plugin-full-update.yml

    - name: UPGRADE - safe-restart after plugins installed
      ansible.builtin.include_tasks: master/safe-restart.yml

    - name: UPGRADE - version marker
      ansible.builtin.include_tasks: master/marker-initialized.yml
