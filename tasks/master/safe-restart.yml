---

- name: safe-restart after plugins installed
  ansible.builtin.shell: >
    java -jar {{ jenkins_dir }}/jenkins-cli.jar -s http://localhost:8080 -http
    {% if jenkins_cli_auth_required and jenkins_cli_api_username is defined and jenkins_cli_api_password is defined %}
    -auth {{ jenkins_cli_api_username }}:{{ jenkins_cli_api_password }}
    {% endif %}
    safe-restart
  args:
    executable: /bin/bash

- name: check login page after restart
  ansible.builtin.include_tasks: common/login.yml
