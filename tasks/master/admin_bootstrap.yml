---
# Functional: Admin user and groovy scripts setup
# Used by: install.yml
# Consolidates: setup-groovy-scripts.yml, setup-admin-user.yml

- name: Generate groovy scripts for Jenkins
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ jenkins_dir }}/groovy/{{ item | splitext | first }}"
    owner: "{{ jenkins_servlet_user }}"
    group: "{{ jenkins_servlet_group }}"
  loop:
    - plugin_install.groovy.j2
    - plugin_safe_update.groovy.j2
    - plugin_full_update.groovy.j2
    - update_center_check.groovy.j2
    - create-admin-user.groovy.j2
  loop_control:
    label: "{{ item }}"

- name: Setup administrator user
  ansible.builtin.shell: >
    java -jar {{ jenkins_dir }}/jenkins-cli.jar -s http://localhost:8080 -http
    groovy = < {{ jenkins_dir }}/groovy/create-admin-user.groovy
  args:
    executable: /bin/bash
