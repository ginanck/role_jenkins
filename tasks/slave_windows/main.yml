---

### NEEDS TO BE IMPROVED and TESTED
- name: Include Windows slaves variables
  ansible.builtin.include_vars: slave_windows.yml

- name: get node_secrets from master which used groovy result
  ansible.builtin.set_fact:
    exported_node_secrets: "{{ hostvars[groups['master'][0]].node_secrets }}"

- name: Ensure Java is installed
  win_chocolatey:
    name: corretto11jdk
    version: "11.0.19"
    state: present

- name: Create workspace directory
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ jenkins_agent_workdir }}"
    - "{{ jenkins_agent_remoting }}"

- name: Ensure NSSM directory exists
  ansible.windows.win_file:
    path: "{{ jenkins_win_nssm_path }}"
    state: directory

- name: Check if NSSM is already installed
  ansible.windows.win_stat:
    path: "{{ jenkins_win_nssm_path }}\\{{ jenkins_win_nssm_file_name | regex_replace('\\.zip', '') }}\\win64\\nssm.exe"
  register: nssm_installed

- name: Download NSSM
  ansible.windows.win_get_url:
    url: "{{ jenkins_win_nssm_svc_url }}"
    dest: "{{ jenkins_win_nssm_path }}\\{{ jenkins_win_nssm_file_name }}"
  when: not nssm_installed.stat.exists

- name: Unzip NSSM
  community.windows.win_unzip:
    src: "{{ jenkins_win_nssm_path }}\\{{ jenkins_win_nssm_file_name }}"
    dest: "{{ jenkins_win_nssm_path }}"
    delete_archive: yes
  when: not nssm_installed.stat.exists

- name: Set NSSM path
  ansible.windows.win_path:
    elements:
      - "{{ jenkins_win_nssm_path }}\\{{ jenkins_win_nssm_file_name | regex_replace('\\.zip', '') }}\\win64"
    state: present

- name: Ensure agent directory exists
  ansible.windows.win_file:
    path: "{{ jenkins_win_dir }}"
    state: directory

- name: Download Jenkins agent.jar
  ansible.windows.win_get_url:
    url: "{{ jenkins_http_url }}/jnlpJars/agent.jar"
    dest: "{{ jenkins_win_dir }}\\agent.jar"
    force: yes

- name: Copy node configuration script
  ansible.windows.win_copy:
    src: configureNode.groovy
    dest: "{{ jenkins_win_dir }}\\configureNode.groovy"

- name: Check if {{ jenkins_win_agent_service_name }} service exists
  ansible.windows.win_service:
    name: "{{ jenkins_win_agent_service_display_name }}"
  register: jenkins_agent_service

- name: Create batch file to run {{ jenkins_win_agent_service_display_name }}
  ansible.builtin.template:
    src: slaves/jenkins_agent.bat.j2
    dest: "{{ jenkins_win_dir }}\\jenkins_agent.bat"
  vars:
    AgentSecret: "{{ exported_node_secrets[item.name] }}"
    AgentName: "{{ item.name }}"
  register: batch_file
  when: jenkins_agent_name == item.name
  loop: "{{ jenkins_config_nodes_list }}"

- name: Install Jenkins agent as a service
  ansible.windows.win_shell: |
    nssm install {{ jenkins_win_agent_service_name }} {{ jenkins_win_dir }}\\jenkins_agent.bat
    nssm set {{ jenkins_win_agent_service_name }} DisplayName "{{ jenkins_win_agent_service_display_name }}"
    nssm set {{ jenkins_win_agent_service_name }} Description "This service runs a Jenkins agent"
    
    # Set Environment Variables
    {% for key, value in jenkins_agent_env_vars.items() %}
    nssm set {{ jenkins_win_agent_service_name }} AppEnvironmentExtra {{ key }}={{ value }}
    {% endfor %}
    
    # Configure restart behavior
    nssm set {{ jenkins_win_agent_service_name }} AppRestartDelay {{ jenkins_agent_connection_retry_interval * 1000 }}
  when: jenkins_agent_service.exists == False and batch_file.changed

- name: Check if NSSM is running
  ansible.windows.win_shell: |
    $ProcessActive = (Get-Process -Name nssm -ErrorAction SilentlyContinue).Count -gt 0
    if ($ProcessActive) { 
      Stop-Process -Name 'nssm' -Force 
      Write-Host "NSSM service found and stopped"
    }
    else {
      Write-Host "No NSSM service found"
    }
  when: jenkins_agent_service.exists == True

- name: Reconfigure Jenkins agent service
  ansible.windows.win_shell: |
    nssm edit {{ jenkins_win_agent_service_name }} {{ jenkins_win_dir }}\\jenkins_agent.bat
    nssm set {{ jenkins_win_agent_service_name }} DisplayName "{{ jenkins_win_agent_service_display_name }}"
    nssm set {{ jenkins_win_agent_service_name }} Description "This service runs a Jenkins agent"
    
    # Set Environment Variables
    {% for key, value in jenkins_agent_env_vars.items() %}
    nssm set {{ jenkins_win_agent_service_name }} AppEnvironmentExtra {{ key }}={{ value }}
    {% endfor %}
    
    # Configure restart behavior
    nssm set {{ jenkins_win_agent_service_name }} AppRestartDelay {{ jenkins_agent_connection_retry_interval * 1000 }}
  when: jenkins_agent_service.exists == True and batch_file.changed

- name: Download jenkins-cli.jar
  ansible.windows.win_get_url:
    url: "{{ jenkins_http_url }}/jnlpJars/jenkins-cli.jar"
    dest: "{{ jenkins_win_dir }}\\jenkins-cli.jar"
    validate_certs: false
  register: cli_result

- name: Configure node properties via Jenkins CLI
  ansible.windows.win_shell: >
    java -jar {{ jenkins_win_dir }}\\jenkins-cli.jar -s {{ jenkins_http_url }}
    {% if jenkins_cli_api_username is defined and jenkins_cli_api_username | length > 0 and 
          jenkins_cli_api_password is defined and jenkins_cli_api_password | length > 0 %}
    -auth {{ jenkins_cli_api_username }}:{{ jenkins_cli_api_password }}
    {% else %}
    -auth {{ jenkins_svc_admin_account_username }}:{{ jenkins_svc_admin_account_password }}
    {% endif %}
    groovy {{ jenkins_win_dir }}\\configureNode.groovy
    "{{ jenkins_agent_name }}"
    "{{ jenkins_agent_executors }}"
    "{{ jenkins_agent_labels }}"
    "{{ jenkins_agent_description }}"
    "{{ jenkins_agent_mode }}"
  register: node_config_result
  when: cli_result is success

- name: Ensure {{ jenkins_win_agent_service_name }} service is started
  ansible.windows.win_service:
    name: "{{ jenkins_win_agent_service_display_name }}"
    state: restarted
    start_mode: auto

- name: Install required packages for Windows agent
  win_chocolatey:
    name: "{{ item }}"
    state: present
  loop:
    - git
    - 7zip
    - dotnet-sdk
    - visualstudio2019buildtools
    - nodejs-lts
  ignore_errors: true  # Some packages might fail but we want to continue
