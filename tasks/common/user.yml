---

- name: Ensure group exists
  ansible.builtin.group:
    name: "{{ defined_jenkins_group }}"
    state: present

- name: Create jenkins user
  ansible.builtin.user:
    name: "{{ defined_jenkins_user }}"
    group: "{{ defined_jenkins_group }}"
    shell: "/bin/bash"
    home: "{{ defined_jenkins_dir }}"
    create_home: false
    state: present
