---

- name: download jenkins-cli.jar file into version directory
  ansible.builtin.get_url:
    url: "http://localhost:8080/jnlpJars/jenkins-cli.jar"
    dest: "{{ jenkins_versioned_dir }}/jenkins-cli.jar"
    tmp_dest: "{{ jenkins_versioned_dir }}"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
    validate_certs: false
  retries: 20
  delay: 5
  register: cli_result
  until: cli_result is success
