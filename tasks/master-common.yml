---

- name: Check creds are defined for jenkins admin user
  ansible.builtin.include_tasks: check-creds.yml

- name: Install Jenkins Instance
  ansible.builtin.include_tasks: master-install.yml
  when:
    - jenkins_setup_type is defined
    - jenkins_setup_type == "install"

- name: Upgrade Jenkins Instance
  ansible.builtin.include_tasks: master-upgrade.yml
  when:
    - jenkins_setup_type is defined
    - jenkins_setup_type == "upgrade"

# Download WAR file from https://get.jenkins.io/war-stable/
- name: Check jenkins.war file exist
  ansible.builtin.include_tasks: check-file.yml
  vars:
    path: "{{ jenkins_versioned_dir }}/jenkins.war"

- name: Download WAR file into version directory
  ansible.builtin.get_url:
    url: "{{ jenkins_war_file }}"
    dest: "{{ jenkins_versioned_dir }}/jenkins.war"
    tmp_dest: "{{ jenkins_versioned_dir }}"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
  when: not file_result.stat.exists

- name: Create alternative for jenkins with slaves
  community.general.alternatives:
    name: "{{ jenkins_service }}"
    priority: "{{ jenkins_timestamp }}"
    link: /etc/alternatives/jenkins
    path: "{{ jenkins_versioned_dir }}"
    slaves:
      - name: "{{ jenkins_service }}_home"
        link: "/etc/alternatives/{{ jenkins_service }}_home"
        path: "{{ jenkins_versioned_dir }}/home"
      - name: "{{ jenkins_service }}_config"
        link: "/etc/alternatives/{{ jenkins_service }}_config"
        path: "{{ jenkins_versioned_dir }}/home/config"
      - name: "{{ jenkins_service }}_war"
        link: "/etc/alternatives/{{ jenkins_service }}_war"
        path: "{{ jenkins_versioned_dir }}/{{ jenkins_service }}.war"
      - name: "{{ jenkins_service }}_cli"
        link: "/etc/alternatives/{{ jenkins_service }}_cli"
        path: "{{ jenkins_versioned_dir }}/{{ jenkins_service }}-cli.jar"
    state: selected

- name: Fetch current Jenkins alternatives
  ansible.builtin.command: update-alternatives --display {{ jenkins_service }}
  changed_when: false
  register: jenkins_alternatives_output

- name: Parse Jenkins alternatives output
  ansible.builtin.set_fact:
    jenkins_alternatives: "{{ jenkins_alternatives_output.stdout_lines|select('match', '^.+ - priority .+$')|map('regex_replace', '^(.+) - priority (.+)$', '\\2 \\1')|sort }}"

- name: Ensure only the last 5 alternatives are kept
  community.general.alternatives:
    name: "{{ jenkins_service }}"
    path: "{{ item.split()[1] }}"
    state: absent
  loop: "{{ jenkins_alternatives[:-5] }}"
  when: "{{ jenkins_alternatives|length > 5 }}"

- name: Create /etc/sysconfig/jenkins
  ansible.builtin.template:
    src: jenkins-sysconfig.j2
    dest: "{{ jenkins_sysconfig }}"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"

- name: Create jenkins systemd service 
  ansible.builtin.template:
    src: jenkins-systemd.j2
    dest: /etc/systemd/system/{{ jenkins_service }}.service
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"

- name: Start Jenkins Service
  ansible.builtin.systemd:
    name: jenkins
    state: started
    daemon_reload: true
    enabled: true

- name: Check login page after Jenkins Started
  ansible.builtin.include_tasks: check-login.yml

- name: Download jenkins-cli.jar when login available
  ansible.builtin.include_tasks: setup-cli.yml
  when:
    - not login_result.failed
    - login_result.status == 200

- name: Setup jenkins plugins
  ansible.builtin.include_tasks: setup-plugin.yml

- name: Update jenkins plugins
  ansible.builtin.include_tasks: update-plugin.yml
  when:
    - jenkins_setup_type is defined
    - jenkins_setup_type == "upgrade"

- name: Create jenkins configurations
  ansible.builtin.template:
    src: "{{ template }}"
    dest: "{{ jenkins_versioned_dir }}/home/config/{{ template | splitext | first }}"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
  loop_control:
    loop_var: template
  loop:
    - config-agent.yml.j2
    - config-authorization.yaml.j2
    - config-credentials.yaml.j2
    - config-global.yaml.j2
    - config-security.yaml.j2
    - config-tool.yaml.j2
    - config-unclassified.yaml.j2
    - config-views.yml.j2
    - "{{ 'config-ldap.yaml.j2' if jenkins_auth_backend == 'ldap' else none }}"

- name: Restart Jenkins Service
  ansible.builtin.systemd:
    name: jenkins
    state: restarted
    enabled: true

- name: Check login page is after Jenkins Restarted
  ansible.builtin.include_tasks: check-login.yml
