---

- name: create jenkins directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ jenkins_servlet_user }}"
    group: "{{ jenkins_servlet_group }}"
    state: directory
    recurse: true
    mode: '0775'
  with_items:
    - "{{ jenkins_versioned_dir }}"
    - "{{ jenkins_versioned_home }}"
  loop_control:
    label: "{{ item }}"
