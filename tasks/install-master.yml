---

- name: create a jenkins directories
  ansible.builtin.file:
    path: "{{ directory }}"
    recurse: yes
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
    state: directory
  with_items:
    - "{{ jenkins_config_dir }}"
    - "{{ jenkins_versioned_home }}"
    - "{{ jenkins_dir }}/groovy"
  loop_control:
    loop_var: directory

- name: check creds are defined for jenkins admin user
  ansible.builtin.include_tasks: check-creds.yml

# Download WAR file from https://get.jenkins.io/war-stable/
- name: check jenkins.war file exist
  ansible.builtin.include_tasks: check-file.yml
  vars:
    path: "{{ jenkins_versioned_dir }}/jenkins.war"

- name: download WAR file into version directory
  ansible.builtin.get_url:
    url: "https://get.jenkins.io/war-stable/{{ jenkins_default_version }}/jenkins.war"
    dest: "{{ jenkins_versioned_dir }}/jenkins.war"
    tmp_dest: "{{ jenkins_versioned_dir }}"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
  when: not file_result.stat.exists

# Update Alternatives
- name: get epoch time alternatives priority
  set_fact:
    adjusted_timestamp: "{{ lookup('pipe', 'date +%s') | int % 2147483647 }}"

- name: update alternatives for the default Jenkins version WAR file
  community.general.alternatives:
    name: "{{ jenkins_service }}.war"
    link: /etc/alternatives
    path: "{{ jenkins_versioned_dir }}/{{ jenkins_service }}.war"
    priority: "{{ adjusted_timestamp }}"
    state: selected

- name: fetch current Jenkins alternatives
  ansible.builtin.command: update-alternatives --display {{ jenkins_service }}.war
  changed_when: false
  register: jenkins_alternatives_output

- name: parse Jenkins alternatives output
  ansible.builtin.set_fact:
    jenkins_alternatives: "{{ jenkins_alternatives_output.stdout_lines|select('match', '^.+ - priority .+$')|map('regex_replace', '^(.+) - priority (.+)$', '\\2 \\1')|sort }}"

- name: ensure only the last 4 alternatives are kept
  community.general.alternatives:
    name: "{{ jenkins_service }}.war"
    path: "{{ item.split()[1] }}"
    state: absent
  loop: "{{ jenkins_alternatives[:-4] }}"
  when: "{{ jenkins_alternatives|length > 4 }}"

# Create sysconfig
- name: create /etc/sysconfig/jenkins
  ansible.builtin.template:
    src: jenkins-sysconfig.j2
    dest: "{{ jenkins_sysconfig }}"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"

- name: create jenkins systemd service 
  ansible.builtin.template:
    src: jenkins-systemd.j2
    dest: /etc/systemd/system/{{ jenkins_service }}.service
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"

- name: create jenkins configurations
  ansible.builtin.template:
    src: "{{ template }}"
    dest: "{{ jenkins_config_dir }}/{{ template | splitext | first }}"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
  loop_control:
    loop_var: template
  loop:
    - config-agent.yml.j2
    - config-authorization.yaml.j2
    - config-credentials.yaml.j2
    - config-global.yaml.j2
    - config-security.yaml.j2
    - config-tool.yaml.j2
    - config-unclassified.yaml.j2
    - config-views.yml.j2
    - "{{ 'config-ldap.yaml.j2' if jenkins_auth_backend == 'ldap' else none }}"

- name: Restart Jenkins Service
  ansible.builtin.systemd:
    name: jenkins
    state: restarted
    daemon_reload: true
    enabled: true

- name: check login page is available
  ansible.builtin.include_tasks: check-login.yml

- name: download jenkins-cli.jar when login available
  ansible.builtin.include_tasks: setup-cli.yml
  when:
    - not login_result.failed
    - login_result.status == 200

- name: install jenkins plugins
  ansible.builtin.include_tasks: install-plugin.yml
