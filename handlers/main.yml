---
# handlers file for role_jenkins

- name: Restart Jenkins Service
  ansible.builtin.systemd:
    name: jenkins
    state: restarted

- name: Stop Jenkins Service
  ansible.builtin.systemd:
    name: jenkins
    state: stopped

- name: Restart Jenkins Agent Service
  ansible.builtin.systemd:
    name: jenkins-agent
    state: restarted
